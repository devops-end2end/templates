apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: react-frontend-golden-path
  title: React Frontend Application Golden Path
  description: Production-ready React & Vite frontend micro-frontend template adhering to enterprise standards.
  tags:
    - react
    - vite
    - frontend
    - golden-path
spec:
  owner: platform-engineering
  type: website

  parameters:
    - title: Provide Service Metadata
      required:
        - componentId
        - description
        - owner
      properties:
        componentId:
          title: Component ID
          type: string
          description: Unique slug/name of the frontend app (e.g. customer-portal)
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          description: Brief description of what this frontend application does
        owner:
          title: Owner
          type: string
          description: Owner of the component (Team or User)
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        nodejs_version:
          title: Node.js Version
          type: string
          default: "20"
          enum:
            - "18"
            - "20"
            - "22"
          description: Select the target Node.js version for your frontend application.

    - title: Choose Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - devops-end2end
  steps:
    - id: fetch
      name: Fetch Skeleton Boilerplate
      action: fetch:template
      input:
        url: ./skeleton
        values:
          componentId: ${{ parameters.componentId }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          nodejs_version: ${{ parameters.nodejs_version }}

    - id: publish
      name: Publish to Git Repository
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        access: 'private'

    - id: create-ecr
      name: Create ECR Repository
      action: roadiehq:aws:ecr:create
      input:
        repoName: ${{ parameters.componentId }}
        region: us-east-1
        imageMutability: true  # false = MUTABLE, true = IMMUTABLE
        scanOnPush: false
        tags:
          - Key: Owner
            Value: ${{ parameters.owner }}
          - Key: ManagedBy
            Value: Backstage

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['publish'].output.entityRef }}
