apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: go-api-service-golden-path
  title: Go API Service Golden Path
  description: Production-ready Go microservice template using Go standard library and best practices.
  tags:
    - go
    - rest-api
    - golden-path
spec:
  owner: platform-engineering
  type: service

  parameters:
    - title: Provide Service Metadata
      required:
        - componentId
        - description
        - owner
      properties:
        componentId:
          title: Component ID
          type: string
          description: Unique slug/name of the service (e.g. order-api)
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          description: Brief description of what this service does
        owner:
          title: Owner
          type: string
          description: Owner of the component (Team or User)
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        go_version:
          title: Go Version
          type: string
          default: "1.22"
          enum:
            - "1.21"
            - "1.22"
            - "1.23"
          description: Select the target Go version for your microservice.

    - title: Choose Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - devops-end2end

  steps:
    - id: fetch
      name: Fetch Skeleton Boilerplate
      action: fetch:template
      input:
        url: ./skeleton
        values:
          componentId: ${{ parameters.componentId }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to Git Repository
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        access: 'private'

    - id: create-ecr
      name: Create ECR Repository
      action: roadiehq:aws:ecr:create
      input:
        repoName: ${{ parameters.componentId }}
        region: us-east-1
        imageMutability: true  # false = MUTABLE, true = IMMUTABLE
        scanOnPush: false
        tags:
          - Key: Owner
            Value: ${{ parameters.owner }}
          - Key: ManagedBy
            Value: Backstage

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['publish'].output.entityRef }}
