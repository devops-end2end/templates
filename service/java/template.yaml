apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: java-spring-boot-golden-path
  title: Java/Spring Boot API Service - Golden Path
  description: Production-ready Java Spring Boot microservice template adhering to enterprise standards.
  tags:
    - java
    - spring-boot
    - golden-path
spec:
  owner: platform-engineering
  type: service

  parameters:
    - title: Provide Service Metadata
      required:
        - componentId
        - description
        - owner
        - java_version
      properties:
        componentId:
          title: Component ID
          type: string
          description: Unique name of the service (e.g., my-python-service)
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Brief description of what this service does
        java_version:
          title: Java Runtime Version
          type: string
          default: "21"
          enum:
            - "8"
            - "11"
            - "17"
            - "21"
          description: Select the target Java version for your microservice toolchain.
        owner:
          title: Owner
          type: string
          description: Owner of the component (e.g., group:default/platform-engineering)
          default: "group:default/platform-engineering"
          ui:field: OwnerPicker          

    - title: Choose a Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - devops-end2end

  steps:
    - id: fetch-base
      name: Fetch Skeleton Files
      action: fetch:template
      input:
        url: ./skeleton
        values:
          componentId: ${{ parameters.componentId }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          java_version: ${{ parameters.java_version }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        gitCommitMessage: 'Initial commit from Backstage Scaffolder'


    - id: create-ecr
      name: Create ECR Repository
      action: roadiehq:aws:ecr:create
      input:
        repoName: ${{ parameters.componentId }}
        region: us-east-1
        imageMutability: true  # false = MUTABLE, true = IMMUTABLE
        scanOnPush: false
        tags:
          - Key: Owner
            Value: ${{ parameters.owner }}
          - Key: ManagedBy
            Value: Backstage

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: ECR Repository
        url: https://console.aws.amazon.com/ecr/repositories/private/us-east-1/${{ parameters.componentId }}?region=us-east-1

