apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: nodejs-express-golden-path
  title: Node.js Express API Service Golden Path
  description: Production-ready Node.js Express microservice template adhering to enterprise standards.
  tags:
    - nodejs
    - express
    - rest-api
    - golden-path
spec:
  owner: platform-engineering
  type: service

  parameters:
    - title: Provide Service Metadata
      required:
        - componentId
        - description
        - owner
      properties:
        componentId:
          title: Component ID
          type: string
          description: Unique slug/name of the service (e.g. user-api)
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          description: Brief description of what this service does
        owner:
          title: Owner
          type: string
          description: Owner of the component (e.g., group:default/platform-engineering)
          default: "group:default/platform-engineering"
          ui:field: OwnerPicker 

    - title: Choose Repository Location
      required:
        - repoUrl
        - nodejs_version
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - devops-end2end
        nodejs_version:
          title: Node.js Version
          type: string
          default: "20"
          enum:
            - "18"
            - "20"
            - "22"
          description: Select the target Node.js version for your backend service.

  steps:
    - id: fetch
      name: Fetch Skeleton Boilerplate
      action: fetch:template
      input:
        url: ./skeleton
        values:
          componentId: ${{ parameters.componentId }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          nodejs_version: ${{ parameters.nodejs_version }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        gitCommitMessage: 'Initial commit from Backstage Scaffolder'

    - id: create-ecr
      name: Create ECR Repository
      action: roadiehq:aws:ecr:create
      input:
        repoName: ${{ parameters.componentId }}
        region: us-east-1
        imageMutability: true  # false = MUTABLE, true = IMMUTABLE
        scanOnPush: false
        tags:
          - Key: Owner
            Value: ${{ parameters.owner }}
          - Key: ManagedBy
            Value: Backstage

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['publish'].output.entityRef }}
