apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.componentId }}
  title: ${{ values.componentId }}
  description: ${{ values.description | default("Backend service component") }}
  tags:
    - nodejs
    - backend
  links:
    - url: http://argocd.local/applications/argocd/${{ values.componentId }}-prod-home1
      title: ArgoCD (Prod)
      icon: dashboard
    - url: http://argocd.local/applications/argocd/${{ values.componentId }}-test-home1
      title: ArgoCD (Test)
      icon: dashboard
  annotations:
    github.com/project-slug: devops-end2end/${{ values.componentId }}
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: core-platform
