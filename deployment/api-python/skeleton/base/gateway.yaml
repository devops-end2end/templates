apiVersion: v1
kind: Service
metadata:
  name: ${{ values.componentId }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app: ${{ values.componentId }}
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${{ values.componentId }}-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.componentId }}-route
spec:
  parentRefs:
    - name: ${{ values.componentId }}-gateway
      sectionName: http
  hostnames:
    - "${{ values.componentId }}.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ${{ values.componentId }}
          port: 8000
