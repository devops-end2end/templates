apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ values.componentId }}-integration-test
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: curl-validator
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Querying http://${{ values.componentId }}:8000/api/v1/health..."
              response=$(curl -sL http://${{ values.componentId }}:8000/api/v1/health)
              echo "Received response: $response"
              
              status=$(echo "$response" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
          
              if [ "$status" = "ok" ] || [ "$status" = "healthy" ]; then
                echo "Health validation passed. Status: $status"
                exit 0
              else
                echo "Health validation failed. Received status '$status'."
                exit 1
              fi
