apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ values.componentId }}-runtime-dashboard
  labels:
    grafana_dashboard: "1"
data:
  ${{ values.componentId }}-slo-runtime.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "grafanaVersion": "11.0.0",
      "title": "${{ values.componentId }} SLO & Request Metrics",
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate (RPS)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m])) by (app, status)",
              "legendFormat": "{{app}} (status: {{status}})"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        }
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "10s"
    }