[project]
name = "${{ values.componentId }}"
# Only manage the first two digits(Major.Minor) version , the third digit (Patch) is managed by GitHub Action
version = "0.1"
description = "${{ values.description }}"
readme = "README.md"
requires-python = ">=${{ values.pythonVersion }}"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 88
