apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: node-service-template
  title: Node.js Service Template
  description: Creates a new Node.js microservice repository in GitHub
spec:
  owner: group:default/engineering
  type: service

  # 1. Define UI inputs gathered from the user
  parameters:
    - title: Component Details
      required:
        - componentId
        - owner
      properties:
        componentId:
          title: Component ID
          type: string
          description: Unique name of the service (e.g., my-node-service)
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Short description of the service
        owner:
          title: Owner
          type: string
          description: Owner of the component (e.g., group:default/engineering)
          ui:field: OwnerPicker

    - title: Choose a Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  # 2. Define the execution steps
  steps:
    # Fetch template files from skeleton directory and template parameters into them
    - id: fetch-base
      name: Fetch Skeleton Files
      action: fetch:template
      input:
        url: ./skeleton
        values:
          componentId: ${{ parameters.componentId }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    # Publish the files to a new GitHub repository
    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        gitCommitMessage: 'Initial commit from Backstage Scaffolder'

    # Register the newly created component into the Backstage Catalog
    # - id: register
    #   name: Register to Catalog
    #   action: catalog:register
    #   input:
    #     catalogInfoUrl: ${{ steps['publish'].output.remoteUrl + '/blob/main/catalog-info.yaml' }}

    - id: register
      name: Register to Catalog
      action: catalog:register
      input:
        # repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: http://github.com/{{ repoUrl.owner }}/{{ parameters.componentId }}/blob/master/catalog-info.yaml

  # 3. Output links shown to the user upon completion
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}